# Builds the dashboard from the public website repository (admin/ of ArmadaResidence/armadaresidence-website) and
# publishes it to this repository's GitHub Pages site → admin.armadaresidence.com (DECISIONS.md 2026-10-25).
# Triggers: manual (gh workflow run deploy.yml -R ArmadaResidence/armadaresidence-admin) or a repository_dispatch from
# the website repository (event "admin-deploy"). A push here never deploys: this repository holds only this workflow.
# Variables (Settings → Variables): VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY (public values), ADMIN_DOMAIN
# (admin.armadaresidence.com once the CNAME exists; leave empty to serve under /armadaresidence-admin/ meanwhile).
name: Deploy dashboard
on:
  workflow_dispatch:
    inputs:
      ref:
        description: website repository ref to build from
        default: main
  repository_dispatch:
    types: [admin-deploy]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ArmadaResidence/armadaresidence-website
          ref: ${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}
      - name: Check the dashboard source is there
        run: |
          if [ ! -f admin/package.json ]; then
            echo "::error::admin/ is not on this ref of armadaresidence-website — nothing to build"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install
        working-directory: admin
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: admin
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE: ${{ vars.ADMIN_DOMAIN != '' && '/' || '/armadaresidence-admin/' }}
        run: |
          npm run build
          # SPA on Pages: every route falls back to index.html; the custom domain travels with the artifact
          cp dist/index.html dist/404.html
          if [ -n "${{ vars.ADMIN_DOMAIN }}" ]; then echo "${{ vars.ADMIN_DOMAIN }}" > dist/CNAME; fi
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: admin/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
